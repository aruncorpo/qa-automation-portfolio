name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest --headless --alluredir=allure-results -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results